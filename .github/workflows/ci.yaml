name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  test:
    name: Build and complete test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          NODE_ENV: production
      - name: Build and start disposable integration services
        run: docker compose -p atrium-share-test -f deploy/compose.test.yml up -d --build --wait
      - run: pnpm test
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379
          TEST_REDIS_URL: redis://127.0.0.1:6379
          S3_ENDPOINT: http://127.0.0.1:9000
          TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_FORCE_PATH_STYLE: "true"
          TEST_ACCESS_KEY_ID: minioadmin
          TEST_SECRET_ACCESS_KEY: minioadmin
      - name: Integration service logs on failure
        if: failure()
        run: docker compose -p atrium-share-test -f deploy/compose.test.yml logs --no-color --tail=100
      - name: Stop integration services
        if: always()
        run: docker compose -p atrium-share-test -f deploy/compose.test.yml down --remove-orphans

  container:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build without publishing
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          platforms: linux/amd64
