name: Secret scan

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@421026a6540c63cf143ef53a5859389d473e88da
        with:
          extra_args: --results=verified,unknown
