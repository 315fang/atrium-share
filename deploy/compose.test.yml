# Disposable integration infrastructure. Never point the test suite at real data.
# Start: docker compose -p atrium-share-test -f deploy/compose.test.yml up -d --build --wait
# Stop:  docker compose -p atrium-share-test -f deploy/compose.test.yml down
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.minio-test
    command: server /data --console-address ":9001"
    environment:
      # Public disposable test credentials, matching tests/test-utils.ts.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${TEST_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${TEST_MINIO_CONSOLE_PORT:-9001}:9001"
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
