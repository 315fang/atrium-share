# Optional recipient-only hostname. Administration stays on files.example.com.
# Use alongside nginx.same-origin.conf; set SHARE_BASE_URL to https://share.example.com.
server {
    listen 443 ssl;
    server_name share.example.com;
    ssl_certificate /etc/nginx/certs/share.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/share.example.com/privkey.pem;

    client_max_body_size 1m;
    server_tokens off;
    add_header Referrer-Policy no-referrer always;

    location ^~ /c/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/atrium-share-proxy.conf;
    }
    location ^~ /s/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/atrium-share-proxy.conf;
    }
    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/atrium-share-proxy.conf;
    }

    # These precise recipient actions are the only public POST routes.
    # Keep the following read prefixes without ^~ so the regex can take priority.
    location ~ ^/api/shares/[A-Za-z0-9_-]+/(unlock|archives|files/[0-9]+/share)$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/atrium-share-proxy.conf;
    }
    location ~ ^/api/short-link/[A-Za-z0-9_-]+/unlock$ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/atrium-share-proxy.conf;
    }
    location /api/shares/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/atrium-share-proxy.conf;
    }
    location /api/short-link/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/atrium-share-proxy.conf;
    }
    # Avoid Nginx's automatic slash redirects for proxied prefixes.
    location = /api/shares { return 404; }
    location = /api/short-link { return 404; }
    # Everything else, including owner create/manage/upload/auth APIs, is rejected.
    location / { return 404; }
}
