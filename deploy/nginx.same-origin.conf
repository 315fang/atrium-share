# Replace the hostname and certificate paths before installing this server block.
# See docs/deployment.md. The app's port must remain reachable only by this proxy.
server {
    listen 443 ssl;
    server_name files.example.com;
    ssl_certificate /etc/nginx/certs/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/files.example.com/privkey.pem;

    # Upload requests contain individual 8 MiB parts, not the entire file.
    client_max_body_size 16m;
    server_tokens off;

    location / {
        include /etc/nginx/snippets/atrium-share-proxy.conf;
    }
}
