services:
  atrium-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      SHARE_READER_CREDENTIALS_FILE: /run/secrets/share-reader.json
      SHARE_DB_PATH: /app/data/shares.sqlite
      SHARE_STORE_PATH: /app/data/shares.json
      SHORT_LINK_STORE: /app/data/shortlinks.json
      UPLOAD_STORE_PATH: /app/data/uploads.sqlite
      OBJECT_INDEX_PATH: /app/data/objects.sqlite
      MEDIA_CACHE_DIR: /app/data/media-cache
      ARCHIVE_DIR: /app/data/archives
      AUDIT_LOG_DIR: /app/audit-logs
    volumes:
      - atrium-data:/app/data
      - audit-logs:/app/audit-logs
      - type: bind
        source: ./secrets/share-reader.json
        target: /run/secrets/share-reader.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  atrium-data:
  audit-logs:
  redis-data:
